# Ingesta programada en GitHub Actions (sustituye a `python -m ingest run` en un ordenador encendido).
# Necesita el secreto DATABASE_URL en el repositorio. Los horarios de GitHub van en UTC y pueden
# retrasarse unos minutos; plan_day es idempotente, por eso se lanza a las 22:00 y 23:00 UTC
# (00:00 de Madrid en verano y en invierno) y otra vez por la mañana por si GitHub se salta alguna.
# AVISO: PCS suele bloquear IPs de servidores en la nube; si ves fallos 403, pide permiso a PCS
# o usa la carga manual desde la app.
name: ingesta
on:
  schedule:
    - cron: "*/5 * * * *"      # tareas pendientes
    - cron: "0 22,23,5 * * *"  # plan del día (y repaso por la mañana)
    - cron: "0 2 * * 1"        # equipos (lunes)
    - cron: "30 2 * * 1"       # calendario (lunes)
  # lo dispara Supabase (pg_cron, migración 0025) a su hora: los horarios de arriba quedan de respaldo
  workflow_dispatch:
    inputs:
      cmd:
        description: "Qué ejecutar"
        type: choice
        options: [tick, plan, teams, calendar]
        default: tick
# una ejecución detrás de otra: nunca dos a la vez sobre las mismas tareas
concurrency:
  group: ingesta
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r ingest/requirements.txt
      - uses: actions/cache@v4
        with: { path: pcs_cache, key: "pcs-${{ github.run_id }}", restore-keys: "pcs-" }
      - name: Ejecutar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          cmd="${{ inputs.cmd }}"
          case "${{ github.event.schedule }}" in
            "0 22,23,5 * * *") cmd=plan ;;
            "0 2 * * 1")       cmd=teams ;;
            "30 2 * * 1")      cmd=calendar ;;
          esac
          case "$cmd" in
            plan)     python -m ingest plan && python -m ingest tick ;;
            # temporada por defecto: la del juego (la de los equipos cargados), no el año natural
            teams)    python -m ingest teams ;;
            calendar) python -m ingest calendar ;;
            *)        python -m ingest tick ;;
          esac
